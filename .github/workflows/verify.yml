name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        # Git Bash provides OpenSSL on the Windows runner for the local HTTPS fixtures.
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pnpm from package.json
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Check verification tools
        run: |
          node --version
          pnpm --version
          openssl version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\run.cmd doctor

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Run unit tests
        # Native helper and Playwright tests can contact the real network. Do not build
        # native helpers or run test:e2e as part of this verification workflow.
        run: pnpm test

      - name: Build application
        run: pnpm build
